<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Książka z Przepisami</title>
    <style>
        :root {
            --primary-pink: #ec4899;
            --primary-blue: #3b82f6;
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-color: #2d3748;
            --border-color: rgba(255, 255, 255, 0.9);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            max-width: 650px; 
            margin: 30px auto; 
            padding: 0 20px 110px 20px; 
            color: var(--text-color);
            min-height: 100vh;
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #fffacd 100%) !important;
            background-attachment: fixed;
        }

        h1 {
            text-align: center;
            color: var(--primary-pink);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 25px;
            font-size: 28px;
        }

        /* Glassmorphism dla głównych kart */
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 25px; 
            margin-bottom: 20px; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(236, 72, 153, 0.08), 0 5px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            animation: fadeIn 0.4s ease-out forwards;
        }

        input, textarea, select { 
            width: 100%; 
            padding: 12px 16px; 
            margin: 8px 0 16px 0; 
            box-sizing: border-box; 
            border: 2px solid #f3e8ff; 
            border-radius: 14px; 
            background: rgba(250, 245, 255, 0.8);
            font-size: 14px;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-pink);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.12);
        }

        button { 
            width: 100%; 
            background: linear-gradient(135deg, var(--primary-pink) 0%, var(--primary-blue) 100%); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 14px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 15px;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 8px; 
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.35);
        }

        /* Pudełko pojedynczego przepisu w stylu Glass */
        .recipe-item { 
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 22px; 
            margin-bottom: 20px; 
            border-radius: 20px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.03); 
            transition: transform 0.2s ease;
        }
        
        .recipe-item:hover {
            transform: translateY(-2px);
        }

        .hidden { display: none; }
        
        #auth-status { 
            font-weight: 600; 
            color: #4a5568; 
            margin-bottom: 15px; 
            text-align: left;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Pigułki makroskładników (Badges) */
        .macro-badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }

        .macro-badge {
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .badge-kcal { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .badge-protein { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .badge-fat { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .badge-carbs { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }

        /* Pigułki filtrowania */
        .filter-chips {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid #f3e8ff;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .chip.active, .chip:hover {
            background: var(--primary-pink);
            color: white;
            border-color: var(--primary-pink);
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.2);
        }

        /* Stan pusty (Empty State) */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        /* Pływający szklany pasek nawigacji iOS - zoptymalizowany pod kątem płynności */
        .floating-glass-nav {
            position: fixed !important;
            bottom: 20px !important;
            left: 50% !important;
            transform: translateX(-50%) translateZ(0) !important;
            width: 92% !important;
            max-width: 480px !important;
            background: rgba(255, 255, 255, 0.5) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.8) !important;
            box-shadow: 0 15px 35px rgba(31, 38, 135, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.9) !important;
            border-radius: 9999px !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 8px 12px !important;
            z-index: 1000 !important;
            touch-action: none;
            will-change: transform;
            backface-visibility: hidden;
        }

        .liquid-bubble {
            position: absolute;
            top: 6px;
            bottom: 6px;
            width: 20%; /* 5 przycisków -> 20% szerokości każdy */
            background: rgba(255, 255, 255, 0.85);
            border-radius: 9999px;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), left 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            z-index: 1;
            will-change: left, transform;
            transform: translateZ(0);
        }

        .tab-btn { 
            position: relative;
            z-index: 2;
            flex: 1; 
            padding: 10px 2px; 
            background: transparent; 
            border: none; 
            border-radius: 9999px; 
            cursor: pointer; 
            font-weight: 600; 
            color: #64748b; 
            text-align: center;
            white-space: nowrap;
            margin-bottom: 0;
            box-shadow: none;
            font-size: 11px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--primary-pink);
            transform: scale(1.05);
        }

        .tab-btn.active { 
            color: var(--primary-pink); 
            font-weight: 700;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <!-- Mały, dyskretny kwadracik profilu w prawym górnym rogu -->
    <div style="position: absolute; top: 20px; right: 20px; z-index: 100;">
        <div id="profile-trigger" onclick="switchTab('profile', document.querySelector('.tab-btn[data-tab=\'profile\']'))" style="width: 34px; height: 34px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--primary-pink); cursor: pointer; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.1); transition: transform 0.2s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            👤
        </div>
    </div>

    <h1>Książka z Przepisami</h1>

    <!-- Główna zawartość zakładek (Przykładowa struktura kontenerów) -->
    <div id="recipes" class="tab-content active card">
        <h2>Twoje Przepisy</h2>
        <p style="color: #64748b; font-size: 14px;">Tutaj pojawią się Twoje zapisane pyszności.</p>
    </div>

    <div id="add" class="tab-content card">
        <h2>Dodaj Przepis</h2>
        <input type="text" placeholder="Nazwa przepisu...">
        <textarea placeholder="Opis / przygotowanie..."></textarea>
        <button>Zapisz przepis</button>
    </div>

    <div id="calculator" class="tab-content card">
        <h2>Kalkulator Kalorii</h2>
        <p style="color: #64748b; font-size: 14px;">Oblicz makroskładniki swoich dań.</p>
    </div>

    <div id="ai" class="tab-content card">
        <h2>Asystent AI</h2>
        <p style="color: #64748b; font-size: 14px;">Zapytaj o modyfikacje przepisów.</p>
    </div>

    <!-- Nowa zakładka Profil ze schowanym przyciskiem wylogowania -->
    <div id="profile" class="tab-content card">
        <h2 style="color: var(--primary-pink); font-size: 20px; margin-bottom: 15px;">Twój Profil</h2>
        <div id="auth-status" style="margin-bottom: 20px; text-align: left;">
            <!-- Tutaj dynamicznie ląduje status zalogowanego użytkownika -->
            Zalogowany jako: Gość
        </div>
        
        <div style="border-top: 1px solid rgba(0,0,0,0.05); padding-top: 20px;">
            <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">Zarządzaj swoim kontem i sesją.</p>
            <button id="logout-btn" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.2);">
                Wyloguj się
            </button>
        </div>
    </div>

    <!-- Pływający pasek nawigacyjny z 5 przyciskami i bąbelkiem -->
    <nav class="floating-glass-nav">
        <div class="liquid-bubble" id="liquidBubble"></div>
        <button class="tab-btn active" data-tab="recipes" onclick="switchTab('recipes', this)">Przepisy</button>
        <button class="tab-btn" data-tab="add" onclick="switchTab('add', this)">Dodaj</button>
        <button class="tab-btn" data-tab="calculator" onclick="switchTab('calculator', this)">Kalkulator</button>
        <button class="tab-btn" data-tab="ai" onclick="switchTab('ai', this)">AI</button>
        <button class="tab-btn" data-tab="profile" onclick="switchTab('profile', this)">Profil</button>
    </nav>

    <script>
        // Logika płynnego przesuwania bąbelka i przełączania zakładek
        function switchTab(tabId, buttonElement) {
            // Ukryj wszystkie zawartości
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // Pokaż wybraną zakładkę
            const targetTab = document.getElementById(tabId);
            if (targetTab) {
                targetTab.classList.add('active');
            }

            // Odznacz wszystkie przyciski w pasku
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Zaznacz kliknięty przycisk (lub ten wywołany z ikonki w rogu)
            if (buttonElement) {
                buttonElement.classList.add('active');
            }

            // Przesuń płynnie szklany bąbelek na odpowiednią pozycję (indeks 0-4)
            const buttons = Array.from(document.querySelectorAll('.tab-btn'));
            const activeIndex = buttons.findIndex(btn => btn.getAttribute('data-tab') === tabId);
            
            if (activeIndex !== -1) {
                const bubble = document.getElementById('liquidBubble');
                // Każdy przycisk zajmuje 20% szerokości paska
                bubble.style.left = `calc(${activeIndex * 20}% + 4px)`;
                bubble.style.width = `calc(20% - 8px)`;
            }
        }

        // Inicjalizacja pozycji bąbelka przy starcie
        window.addEventListener('DOMContentLoaded', () => {
            const activeBtn = document.querySelector('.tab-btn.active');
            if (activeBtn) {
                switchTab(activeBtn.getAttribute('data-tab'), activeBtn);
            }
        });
    </script>
</body>
</html>
